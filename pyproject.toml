[project]
name = "localmodels"
version = "0.1.0"
description = "One-command start/stop of self-hosted models on a Colab G4 runtime, used from DeepSeek Harness"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Installed on the Colab runtime by remote/bootstrap.sh
remote = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "psutil>=5.9",
  "huggingface_hub[hf_transfer]>=0.30",
]

[project.scripts]
lm = "lm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm"]

[tool.pytest.ini_options]
pythonpath = ["src", "remote"]
testpaths = ["tests"]
